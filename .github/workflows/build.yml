name: Validate and package
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: make test vet
      - run: go test -race -run '^TestReserve' -count=1 ./...
      - name: Real CPA v8.0.27 dynamic integration
        run: bash scripts/test-host-integration.sh
  package:
    needs: test
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Package
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          VERSION=0.2.3-dev
          if [[ "$RELEASE_TYPE" == tag ]]; then VERSION="${RELEASE_REF#v}"; fi
          make package VERSION="$VERSION"
          cd dist
          sha256sum -c *.zip.sha256
          unzip -l *.zip
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    environment: release-approval
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish approved tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c *.zip.sha256
          cat *.zip.sha256 > checksums.txt
          NOTES="../docs/releases/$RELEASE_TAG.md"
          if [[ -f "$NOTES" ]]; then
            gh release create "$RELEASE_TAG" *.zip *.zip.sha256 checksums.txt --repo "$RELEASE_REPO" --verify-tag --title "Codex Quota Reserve $RELEASE_TAG" --notes-file "$NOTES"
          else
            gh release create "$RELEASE_TAG" *.zip *.zip.sha256 checksums.txt --repo "$RELEASE_REPO" --verify-tag --title "Codex Quota Reserve $RELEASE_TAG" --generate-notes
          fi
